  <title>sample</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Pure white background */
    body {
      background-color: #ffffff;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Minimal size and fixed to top-left side */
    .download-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      background-color: #2563eb;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
      transition: background-color 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    .download-btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .download-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
  </style>
</head>

    function getEmbeddedContent() {
      try {
        const bytes = Uint8Array.from(atob(EMBEDDED_CONTENT_B64), c => c.charCodeAt(0));
        return new TextDecoder("utf-8").decode(bytes);
      } catch (e) {
        return atob(EMBEDDED_CONTENT_B64);
      }
    }

    async function downloadFile() {
      const btn = document.getElementById("downloadBtn");
      const btnText = document.getElementById("btnText");

      // Default to the embedded new content
      let textContent = getEmbeddedContent();

      // If running through localhost server, fetch live updates from file.txt
      try {
        const response = await fetch("file.txt?t=" + Date.now(), { cache: "no-store" });
        if (response.ok) {
          textContent = await response.text();
        }
      } catch (err) {
        // Runs cleanly even offline or under file:/// protocol with embedded content
      }

      // Create a UTF-8 Blob containing the exact text content
      const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
      const downloadUrl = window.URL.createObjectURL(blob);

      // Trigger automatic direct download of file.txt
      const link = document.createElement("a");
      link.href = downloadUrl;
      link.download = "file.txt";
      document.body.appendChild(link);
      link.click();

      // Visual feedback: briefly show "Downloaded!" on the button
      if (btnText) {
        btnText.textContent = "Downloaded!";
        btn.style.backgroundColor = "#16a34a"; // Green
        setTimeout(() => {
          btnText.textContent = "click";
          btn.style.backgroundColor = "#2563eb"; // Blue
        }, 1500);
      }

      // Safe clean up
      setTimeout(() => {
        document.body.removeChild(link);
        window.URL.revokeObjectURL(downloadUrl);
      }, 60000);
    }
  </script>
